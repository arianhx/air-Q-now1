<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Q Now</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
</head>
<body class="aqi-default">
  <div class="app">
    <header class="header">
      <div class="logo">
        <span class="logo-icon" aria-hidden="true">◎</span>
        <h1>Air Q Now</h1>
      </div>
      <div class="header-actions">
        <button type="button" id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
          <span class="theme-icon-light" aria-hidden="true">☾</span>
          <span class="theme-icon-dark" aria-hidden="true">☀</span>
        </button>
        <button type="button" id="change-key-btn" class="link-btn" hidden>Change API key</button>
      </div>
    </header>

    <main class="main">
      <form id="search-form" class="search-form" autocomplete="off">
        <label for="city-input" class="sr-only">City name</label>
        <div class="search-wrap">
          <div class="search-row">
            <input
              type="text"
              id="city-input"
              name="city"
              placeholder="Search city…"
              required
              spellcheck="false"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="suggestions"
              aria-haspopup="listbox"
            />
            <button type="submit" id="search-btn" class="btn primary">Search</button>
          </div>
          <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
        </div>
      </form>

      <p id="status-msg" class="status-msg" role="status" aria-live="polite" hidden></p>

      <section id="results" class="results-card" hidden>
        <div class="results-header">
          <div class="results-title">
            <h2 id="city-name"></h2>
            <p id="local-time" class="local-time" hidden></p>
          </div>
          <span id="aqi-badge" class="aqi-badge"></span>
        </div>
        <p class="aqi-numeric">
          AQI <strong id="aqi-value"></strong>
          <span class="aqi-scale">/ 5</span>
        </p>
        <p id="aqi-label" class="aqi-label"></p>
        <div id="components" class="components"></div>
      </section>

      <section id="tips" class="tips-card" hidden>
        <h3 id="tips-title" class="tips-title">What you can do</h3>
        <ul id="tips-list" class="tips-list"></ul>
      </section>
    </main>

    <footer class="footer">
      <span>Powered by OpenWeather</span>
    </footer>
  </div>

  <!-- API key modal -->
  <div id="key-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-panel">
      <div id="modal-form-view">
        <h2 id="modal-title">OpenWeather API Key</h2>
        <p class="modal-desc">
          Enter your free API key from
          <a href="https://openweathermap.org/api" target="_blank" rel="noopener noreferrer">OpenWeather</a>
          to look up air quality.
        </p>
        <form id="key-form">
          <label for="api-key-input" class="sr-only">API key</label>
          <input
            type="password"
            id="api-key-input"
            name="apiKey"
            placeholder="Paste your API key"
            autocomplete="off"
            required
          />
          <p id="key-error" class="error-text" hidden></p>
          <button type="submit" id="key-submit-btn" class="btn primary full">Submit</button>
        </form>
      </div>
      <div id="modal-success-view" class="success-view" hidden>
        <p class="success-check" aria-hidden="true">✓</p>
        <p class="success-text">Success</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
